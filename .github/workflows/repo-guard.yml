name: repo-guard

# One job, one job only: keep assembled bundles and screen captures out of the
# repository. `dist/bundle.sh` builds a whole .app from an installed copy of the
# upstream app, and that output once reached a commit by accident — a signed copy of
# someone else's app is not ours to publish.

on:
  push:
  pull_request:

jobs:
  no-assembled-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject app bundles, oversized files and stray dist/ entries
        run: |
          set -eu
          failures=0
          check() {
            if [ -n "$1" ]; then
              printf 'refusing %s:\n%s\n' "$2" "$1" >&2
              failures=1
            fi
          }
          # A built .app is never source, wherever it appears.
          check "$(git ls-files '*.app' '*.app/*' | head -20)" "assembled .app bundles"
          # dist/ holds the three scripts and nothing else.
          check "$(git ls-files 'dist/*' | grep -v '\.sh$' | head -20)" "dist/ files other than the scripts"
          # Anything this large is a binary, a recording or a built bundle. Upstream's
          # own committed artwork stays under design/, docs/ and the icon directory.
          check "$(git ls-files -z | xargs -0 -r stat -c '%s %n' 2>/dev/null \
            | awk '$1 > 2000000' | grep -vE ' (design|docs|crates/openlogi-desktop/icon)/' | head -20)" \
            "tracked files over 2 MB"
          exit "$failures"
